apply:
  - to:
      all
    setMetadata:
      openGraph:
        type: "website"

  - to:
      sitePath: /testpages/metadata
    setMetadata:
      openGraph:
        image:
          url: https://beta.webhare.net/testpages/metadata/testimage.jpg
          alt: "Test image"

  - to:
      sitePath: "*opengraph*"
    setMetadata:
      openGraph:
        siteName: "PluginTest"
