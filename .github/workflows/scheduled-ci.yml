name: Schedule WebHare CI

on:
  schedule:
    - cron: "0 3 * * 1,2,3,4,5" # Run at 03:00 on Monday through Friday

permissions:
  actions: write

jobs:
  dispatch:
    name: Schedule ${{ matrix.ref }}
    if: github.repository == 'WebHare/platform'
    runs-on: ${{ vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        ref: [main] #FIXME add release/6.1 etc as soon as feasible
    steps:
      - uses: actions/github-script@v7
        env:
          TARGET_REF: ${{ matrix.ref }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: process.env.TARGET_REF,
              inputs: { scheduled: 'true' },
            });
