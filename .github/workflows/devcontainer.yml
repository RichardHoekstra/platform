name: WebHare Devcontainer

on:
  schedule:
    - cron: "0 9 * * 1" #monday morning
  workflow_dispatch:
  push:
    branches: #Use feature/devcontainer- branches for development
      - feature/devcontainer-*

permissions:
   contents: read

concurrency: # cancel older workflows when a new push is done on a branch
  group: \({{ github.workflow }}-\){{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  builddocker:
    name: Build Docker
    # See https://github.com/actions/runner-images
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Docker in devcontainer
        run: addons/tests/test-devcontainer-builddocker.sh

  make-install:
    name: Make install
    # See https://github.com/actions/runner-images
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name && vars.WHBUILD_RUNNER && fromJSON(vars.WHBUILD_RUNNER) || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run make install in devcontainer
        run: addons/tests/test-devcontainer-make-install.sh
